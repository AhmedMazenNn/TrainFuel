name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trainfuel
          POSTGRES_USER: trainfuel
          POSTGRES_PASSWORD: ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U trainfuel -d trainfuel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-deployment
      DJANGO_DEBUG: "true"
      POSTGRES_DB: trainfuel
      POSTGRES_USER: trainfuel
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trainfuel
          POSTGRES_USER: trainfuel
          POSTGRES_PASSWORD: ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U trainfuel -d trainfuel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-deployment
      DJANGO_DEBUG: "true"
      POSTGRES_DB: trainfuel
      POSTGRES_USER: trainfuel
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      TRAINFUEL_API_PORT: 8000
      TRAINFUEL_WEB_PORT: 5173
      TRAINFUEL_PYTHON: python
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py migrate --noinput
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
